<!-- Backdrop -->
<div 
  *ngIf="isOpen"
  class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 animate-fadeIn"
  (click)="onBackdropClick($event)">
  
  <!-- Modal -->
  <div class="bg-spotify-darker rounded-lg shadow-2xl max-w-md w-full mx-4 animate-slideUp">
    
    <!-- Header -->
    <div class="p-6 border-b border-spotify-border">
      <h3 class="text-xl font-semibold text-white">{{ title }}</h3>
    </div>
    
    <!-- Body -->
    <div class="p-6">
      <p class="text-spotify-gray">{{ message }}</p>
    </div>
    
    <!-- Footer -->
    <div class="p-6 border-t border-spotify-border flex justify-end gap-3">
      <button
        (click)="onCancel()"
        class="px-4 py-2 rounded-full bg-spotify-border text-white hover:bg-spotify-border-light transition-colors">
        {{ cancelText }}
      </button>
      <button
        (click)="onConfirm()"
        [ngClass]="{
          'bg-red-600 hover:bg-red-700': type === 'danger',
          'bg-yellow-600 hover:bg-yellow-700': type === 'warning',
          'bg-spotify-green hover:bg-spotify-green-hover': type === 'info'
        }"
        class="px-4 py-2 rounded-full text-white transition-colors">
        {{ confirmText }}
      </button>
    </div>
    
  </div>
</div>
