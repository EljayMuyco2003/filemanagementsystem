<!-- Backdrop -->
<div 
  *ngIf="isOpen"
  class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 animate-fadeIn">
  
  <!-- Modal -->
  <div class="bg-spotify-darker rounded-lg shadow-2xl p-8 mx-4 animate-slideUp">
    
    <!-- Spinner -->
    <div class="flex flex-col items-center gap-4">
      <div class="spinner"></div>
      <p class="text-white text-lg">{{ message }}</p>
    </div>
    
  </div>
</div>
