<!-- Mobile Menu Button -->
<button 
  (click)="toggleMobileMenu()"
  class="md:hidden fixed top-4 left-4 z-50 p-2 bg-spotify-green text-black rounded-lg shadow-lg">
  <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
  </svg>
</button>

<!-- Sidebar -->
<aside 
  class="w-64 bg-black flex flex-col fixed md:relative h-full z-40 transition-transform duration-300"
  [class.-translate-x-full]="!mobileMenuOpen"
  [class.translate-x-0]="mobileMenuOpen"
  [class.md:translate-x-0]="true">
  
  <!-- Close button for mobile -->
  <button 
    (click)="closeMobileMenu()"
    class="md:hidden absolute top-4 right-4 text-white hover:text-spotify-green transition">
    <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
    </svg>
  </button>

  <div class="p-6">
    <h1 class="text-2xl font-bold text-white flex items-center gap-2">
      <svg class="h-8 w-8 text-spotify-green" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
      </svg>
      File Portal
    </h1>
  </div>

  <nav class="flex-1 px-4 space-y-2">
    <a routerLink="/dashboard" (click)="closeMobileMenu()" routerLinkActive="bg-spotify-darker" class="flex items-center gap-3 px-4 py-3 text-white hover:bg-spotify-darker rounded-lg transition">
      <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
      </svg>
      Dashboard
    </a>
    <a routerLink="/profile" (click)="closeMobileMenu()" routerLinkActive="bg-spotify-darker" class="flex items-center gap-3 px-4 py-3 text-white hover:bg-spotify-darker rounded-lg transition">
      <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
      </svg>
      My Profile
    </a>
    <a routerLink="/upload" (click)="closeMobileMenu()" routerLinkActive="bg-spotify-darker" class="flex items-center gap-3 px-4 py-3 text-white hover:bg-spotify-darker rounded-lg transition">
      <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
      </svg>
      Upload Files
    </a>
    <a routerLink="/templates" (click)="closeMobileMenu()" routerLinkActive="bg-spotify-darker" class="flex items-center gap-3 px-4 py-3 text-white hover:bg-spotify-darker rounded-lg transition">
      <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
      </svg>
      Templates
    </a>
    <a *ngIf="isAdmin" routerLink="/admin/accounts" (click)="closeMobileMenu()" routerLinkActive="bg-spotify-darker" class="flex items-center gap-3 px-4 py-3 text-white hover:bg-spotify-darker rounded-lg transition">
      <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
      </svg>
      Admin
    </a>
  </nav>

  <div class="p-4 border-t border-spotify-border">
    <div class="flex items-center gap-3 mb-3">
      <div class="w-10 h-10 rounded-full bg-spotify-green flex items-center justify-center text-black font-bold">
        {{ (userName || 'U').charAt(0).toUpperCase() }}
      </div>
      <div class="flex-1 min-w-0">
        <p class="text-white text-sm font-semibold truncate">{{ userName }}</p>
        <p class="text-spotify-gray text-xs">{{ isAdmin ? 'Admin' : 'User' }}</p>
      </div>
    </div>
    <button (click)="logout()" class="w-full px-4 py-2 text-sm text-white hover:text-spotify-green transition">
      Sign Out
    </button>
  </div>
</aside>

<!-- Overlay for mobile -->
<div 
  *ngIf="mobileMenuOpen"
  (click)="closeMobileMenu()"
  class="md:hidden fixed inset-0 bg-black bg-opacity-50 z-30"></div>
